x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - path: .env
      required: true
    - path: airflow/.env.example # airflow-specific runtime vars
      required: true
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${_AIRFLOW_WWW_USER_USERNAME}:${_AIRFLOW_WWW_USER_PASSWORD}@postgres/airflow


     
  volumes:
    # Mount the entire repository root for development
    - ${AIRFLOW_PROJ_DIR}:/opt/airflow/logistics_analytics_project
    - ${AIRFLOW_PROJ_DIR}/airflow/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR}/airflow/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR}/airflow/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR}/airflow/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR}/dbt:/opt/airflow/dbt # dbt folder (Airflow runs dbt)
    - ${AIRFLOW_PROJ_DIR}/scripts:/opt/airflow/scripts

  user: "${AIRFLOW_UID}:0"
  networks:
    - logistics_network
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy


x-superset-user: &superset-user root
x-superset-volumes: &superset-volumes
  # /app/pythonpath_docker will be appended to the PYTHONPATH in the final container
  - ./superset:/app/my_superset
  - superset_home:/app/superset_home
  - ./superset/superset_config.py:/app/pythonpath/superset_config.py
  - ./logistics_tracking.duckdb:/app/data/logistics_tracking.duckdb

x-superset-env: &superset-env
  DATABASE_USER: ${DATABASE_USER:-superset}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-superset}
  POSTGRES_USER: ${DATABASE_USER:-superset}
  POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-superset}
  EXAMPLES_USER: ${EXAMPLES_USER:-examples}
  EXAMPLES_PASSWORD: ${EXAMPLES_PASSWORD:-examples}
  SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
  SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Superset}
  SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-Admin}
  SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@superset.com}



services:
  postgres:
    image: postgres:16
    env_file:
      - path: airflow/.env.example # default
        required: true
    environment:
      POSTGRES_USER: ${_AIRFLOW_WWW_USER_USERNAME}
      POSTGRES_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    networks:
      - logistics_network


  airflow-apiserver:
    <<: *airflow-common   # ← "Copy all config from airflow-common here"
    command: api-server   # ← Plus override/add this
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common  # ← "Copy all config from airflow-common here"
    command: scheduler   # ← Plus override/add this
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

    working_dir: /opt/airflow/logistics_analytics_project

  airflow-dag-processor:
    <<: *airflow-common       # ← "Copy all config from airflow-common here"
    command: dag-processor    # ← Plus override/add this
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: /opt/airflow/scripts/airflow-init.sh
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    networks:
      - logistics_network
    user: "0:0"

  duckdb:
    image: duckdb/duckdb
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    network_mode: host # for duckdb web ui

  dbt:
    build:
      # context: .
      dockerfile: Dockerfile.dbt
      target: dbt-third-party # name of the build stage from the Dockerfile you want to build and run.
      args:
        dbt_third_party: "dbt-duckdb"  # or whichever plugin you need
    image: my-dbt:latest
    volumes:
      - .:/workspace
      - ./dbt:/usr/app/dbt
      - ./.dbt:/root/.dbt
    working_dir: /usr/app/dbt/
    stdin_open: true
    tty: true
    command: sleep infinity
    network_mode: host # dbt docs UI is served via host network
    depends_on:
      - duckdb

  superset-db-init:
    image: postgres:16
    env_file:
      - path: airflow/.env.example # default
        required: true
      - path: superset/.env.example
        required: true
    environment:
      <<: *superset-env
      POSTGRES_USER: ${_AIRFLOW_WWW_USER_USERNAME}
      POSTGRES_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    volumes:
      - ./superset/superset-db-init.sh:/tmp/superset-db-init.sh:ro
    command: ["/bin/bash", "/tmp/superset-db-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logistics_network
    restart: "no"

  superset-init:
    image: apache/superset:5.0.0
    env_file:
      - path: superset/.env.example # default
        required: true
      - path: .env # local override / secrets for this project
        required: true
    environment:
      <<: *superset-env
    user: *superset-user
    volumes: *superset-volumes
    command: ["/app/my_superset/superset-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      superset-db-init:
        condition: service_completed_successfully
    networks:
      - logistics_network

  superset:
    image: apache/superset:5.0.0
    env_file:
      - path: superset/.env.example # default
        required: true
      - path: .env # local override / secrets for this project
        required: true
    environment:
      <<: *superset-env
    volumes: *superset-volumes
    user: *superset-user
    restart: unless-stopped
    command: ["/app/my_superset/superset-bootstrap.sh", "app"]
    ports:
      - ${SUPERSET_PORT:-8088}:8088
      # When in cypress-mode ->
      - ${CYPRESS_PORT:-8081}:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      superset-db-init:
        condition: service_completed_successfully
      superset-init:
        condition: service_completed_successfully
    networks:
      - logistics_network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    networks:
      - logistics_network

networks:
  logistics_network:
    name: logistics_network
    driver: bridge
    

volumes:
  postgres-db-volume:
  superset_home:
    external: false
  redis:
    external: false


