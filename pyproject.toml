[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-analytics"
version = "0.1.0"
description = "Ingestion utilities and runtime dependencies for logistics analytics."
requires-python = ">=3.10"
dependencies = [
  "duckdb==1.4.4",
  "pandas==2.3.3",
  "openpyxl==3.1.5",
  "pyarrow>=17.0.0",
  "apache-airflow-providers-dbt-cloud>=3.8.0",
  "dbt-core>=1.8,<2.0",
  "dbt-duckdb>=1.8,<2.0",
  "docker>=7.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]